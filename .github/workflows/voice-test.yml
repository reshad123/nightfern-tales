name: Voice test (Kokoro)

on:
  workflow_dispatch:

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup ffmpeg
        run: |
          set -euo pipefail
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          for i in 1 2 3 4 5; do
            if curl -fL --retry 3 --retry-delay 2 -o /tmp/ffmpeg.tar.xz "$url"; then
              break
            fi
            sleep $((i * 3))
          done
          mkdir -p /tmp/ffmpeg-extract
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract
          bin_dir="$(find /tmp/ffmpeg-extract -type d -name bin -print -quit)"
          sudo install -m 755 "$bin_dir/ffmpeg" /usr/local/bin/ffmpeg
          sudo install -m 755 "$bin_dir/ffprobe" /usr/local/bin/ffprobe

      - name: Cache the voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-model-v1

      - name: Python packages
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Make voice samples
        env:
          TTS_ENGINE: kokoro
          KOKORO_SPEED: "0.8"
        run: python main.py voice-test

      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: workdir/voice_samples
